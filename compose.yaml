services:
  portfolio:
    image: registry.madalimasykur.my.id/madalimasykur/ali-portfolio:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ali-portfolio
    ports:
      - '3500:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
